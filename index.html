<style>
  :root{
    --bg: #FAFAF7;
    --bg-2: #F3F2EE;
    --ink: #0A0A0A;
    --ink-2: #1A1A1A;
    --muted: #6F6B66;
    --muted-2: #94908A;
    --line: #E8E6E0;
    --line-2: #EDEBE6;
    --card: #FFFFFF;
    --accent: oklch(0.62 0.07 165);     /* sage */
    --accent-soft: oklch(0.62 0.07 165 / 0.10);
    --accent-ink: oklch(0.42 0.06 165);
    --sans: "Geist", ui-sans-serif, -apple-system, system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --serif: "Instrument Serif", "Times New Roman", serif;
    --gutter: clamp(20px, 4vw, 56px);
    --rhythm: clamp(96px, 12vw, 160px);
    --radius: 14px;
    --radius-lg: 18px;
  }

  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
  body{
    font-family: var(--sans);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    letter-spacing: -0.005em;
    text-rendering: optimizeLegibility;
  }
  ::selection{ background: var(--accent-soft); color: var(--accent-ink); }

  /* ── Type scale ─────────────────────────────── */
  .eyebrow{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }
  .eyebrow .dot{
    display:inline-block; width:6px; height:6px; border-radius:50%;
    background: var(--accent); margin-right: 10px; vertical-align: 1px;
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  h1, h2, h3{ margin:0; font-weight: 500; letter-spacing: -0.025em; line-height: 1.02; }
  h1{ font-size: clamp(48px, 6.4vw, 88px); font-weight: 460; letter-spacing: -0.035em; }
  h2{ font-size: clamp(36px, 4.8vw, 64px); letter-spacing: -0.03em; }
  h3{ font-size: clamp(20px, 1.6vw, 24px); letter-spacing: -0.015em; font-weight: 500; }
  p{ margin:0; }

  /* italic serif accent inside a primarily-sans heading */
  .ital{ font-family: var(--serif); font-style: italic; font-weight: 400; letter-spacing: -0.01em; }

  a{ color: inherit; text-decoration: none; }

  /* ── Layout ─────────────────────────────────── */
  .shell{ width:100%; max-width: 1320px; margin: 0 auto; padding: 0 var(--gutter); }

  /* ── Nav ────────────────────────────────────── */
  nav.top{
    position: sticky; top: 0; z-index: 50;
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    background: color-mix(in oklab, var(--bg) 78%, transparent);
    border-bottom: 1px solid transparent;
    transition: border-color .25s ease, background .25s ease;
  }
  nav.top.scrolled{ border-bottom-color: var(--line); }
  nav.top .row{
    display:flex; align-items:center; justify-content:space-between;
    height: 64px;
  }
  .logo{
    display:flex; align-items:center; gap: 10px;
    font-weight: 500; font-size: 17px; letter-spacing: -0.02em;
  }
  .logo .mark{
    width: 22px; height: 22px; border-radius: 8px;
    background: radial-gradient(120% 120% at 30% 30%,
      oklch(0.78 0.10 165) 0%,
      oklch(0.55 0.10 165) 60%,
      oklch(0.35 0.08 165) 100%);
    box-shadow:
      inset 0 0 0 0.5px rgba(255,255,255,.5),
      0 1px 2px rgba(0,0,0,.08),
      0 0 0 4px oklch(0.62 0.07 165 / 0.10),
      0 0 16px 2px oklch(0.62 0.07 165 / 0.28),
      0 0 32px 4px oklch(0.62 0.07 165 / 0.14);
    position: relative; overflow: hidden;
  }
  .logo .mark::after{
    content:""; position:absolute; inset:0;
    background: radial-gradient(80% 80% at 60% 70%, rgba(255,255,255,.35), transparent 60%);
    mix-blend-mode: overlay;
    animation: gooShift 9s ease-in-out infinite alternate;
  }
  @keyframes gooShift{
    0%   { transform: translate(0,0) scale(1); }
    100% { transform: translate(-2px,-1px) scale(1.06); }
  }
  nav.top .links{ display:flex; gap: 28px; align-items:center; }
  nav.top .links a{ font-size: 14px; color: var(--muted); transition: color .15s; }
  nav.top .links a:hover{ color: var(--ink); }
  nav.top .links .cta{
    font-size: 13px; padding: 8px 14px; border-radius: 999px;
    background: var(--ink); color: #fff; font-weight: 500;
    transition: transform .15s ease, background .15s ease;
  }
  nav.top .links .cta:hover{ background: #000; transform: translateY(-0.5px); }
  @media (max-width: 720px){ nav.top .links a:not(.cta){ display:none; } }

  /* ── Hero ───────────────────────────────────── */
  .hero{
    padding: clamp(64px, 9vw, 120px) 0 clamp(80px, 10vw, 140px);
    position: relative; overflow: hidden;
  }
  .hero-grid{
    display:grid;
    grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
    gap: clamp(32px, 5vw, 80px);
    align-items: center;
  }
  @media (max-width: 960px){
    .hero-grid{ grid-template-columns: minmax(0, 1fr); gap: 56px; }
  }
  .hero h1 .line{ display:block; }
  .hero .sub{
    margin-top: 28px;
    color: var(--muted);
    font-size: clamp(17px, 1.3vw, 19px);
    max-width: 30em;
    line-height: 1.5;
  }
  .hero .actions{
    margin-top: 36px;
    display:flex; align-items:center; gap: 14px;
    flex-wrap: wrap;
  }
  .btn-primary{
    display:inline-flex; align-items:center; gap: 8px;
    padding: 13px 20px; border-radius: 999px;
    background: var(--ink); color: #fff;
    font-size: 14.5px; font-weight: 500;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
    box-shadow: 0 1px 0 rgba(255,255,255,.1) inset, 0 6px 18px -8px rgba(0,0,0,.4);
    cursor: pointer; border: 0;
  }
  .btn-primary:hover{ background:#000; transform: translateY(-1px); }
  .btn-primary .arrow{ transition: transform .2s ease; }
  .btn-primary:hover .arrow{ transform: translateX(2px); }
  .btn-ghost{
    display:inline-flex; align-items:center; gap: 8px;
    padding: 13px 16px; border-radius: 999px;
    color: var(--ink); font-size: 14.5px; font-weight: 500;
    transition: background .15s ease;
  }
  .btn-ghost:hover{ background: rgba(0,0,0,.04); }

  .hero .meta-row{
    margin-top: 56px;
    display:flex; gap: 28px;
    font-family: var(--mono);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    color: var(--muted);
    text-transform: uppercase;
    flex-wrap: wrap;
  }
  .hero .meta-row span{ display:inline-flex; align-items:center; gap: 8px; }
  .hero .meta-row .tick{
    width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
  }

  /* Ambient background grain on hero — extremely subtle */
  .hero::before{
    content:""; position:absolute; inset:-10%;
    background:
      radial-gradient(60% 50% at 80% 20%, oklch(0.94 0.04 165 / 0.4), transparent 70%),
      radial-gradient(50% 40% at 10% 90%, oklch(0.94 0.03 80 / 0.35), transparent 70%);
    pointer-events:none; z-index:0;
  }
  .hero > .shell{ position:relative; z-index:1; }

  /* ── Section rhythm ─────────────────────────── */
  section.block{ padding: var(--rhythm) 0; position:relative; }
  section.block + section.block{ border-top: 1px solid var(--line); }
  .section-head{
    display:grid; grid-template-columns: 1.4fr 1fr; gap: clamp(24px, 5vw, 96px);
    margin-bottom: clamp(48px, 6vw, 80px);
    align-items: end;
  }
  @media (max-width: 800px){ .section-head{ grid-template-columns: 1fr; gap: 20px; align-items: start; } }
  .section-head .title-block{ }
  .section-head h2{ margin-bottom: 0; text-wrap: balance; }
  .section-head .title-block .eyebrow{ display:block; margin-bottom: 20px; }
  .section-head .lede{
    color: var(--muted); font-size: clamp(16px, 1.2vw, 18px); max-width: 28em;
    line-height: 1.55;
  }

  /* ── Problem section ────────────────────────── */
  .problem-grid{
    display:grid; grid-template-columns: repeat(4, 1fr);
    border-top: 1px solid var(--line);
    border-left: 1px solid var(--line);
  }
  @media (max-width: 900px){ .problem-grid{ grid-template-columns: 1fr 1fr; } }
  @media (max-width: 560px){ .problem-grid{ grid-template-columns: 1fr; } }
  .problem-cell{
    padding: 32px 28px 36px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: transparent;
    min-height: 200px;
    display:flex; flex-direction:column; justify-content:space-between;
    gap: 18px;
    transition: background .25s ease;
  }
  .problem-cell:hover{ background: color-mix(in oklab, var(--bg-2) 65%, transparent); }
  .problem-cell .num{
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    color: var(--muted-2); text-transform: uppercase;
  }
  .problem-cell h3{
    font-size: clamp(19px, 1.4vw, 22px); font-weight: 500;
    letter-spacing: -0.015em; line-height: 1.25;
  }
  .problem-cell p{
    color: var(--muted); font-size: 14.5px; line-height: 1.55;
  }
  .problem-pullquote{
    margin-top: clamp(56px, 7vw, 88px);
    font-size: clamp(28px, 3.4vw, 44px);
    letter-spacing: -0.025em;
    line-height: 1.15;
    max-width: 22em;
    font-weight: 460;
  }
  .problem-pullquote em{
    font-family: var(--serif); font-style: italic; font-weight: 400;
    color: var(--accent-ink);
  }

  /* ── How it works ───────────────────────────── */
  .steps{
    display:grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(16px, 2vw, 28px);
  }
  @media (max-width: 880px){ .steps{ grid-template-columns: 1fr; } }
  .step{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    padding: clamp(28px, 2.8vw, 40px);
    display:flex; flex-direction: column; gap: 18px;
    min-height: 360px;
    position:relative; overflow:hidden;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .step:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 40px -16px rgba(0,0,0,.12);
  }
  .step .step-num{
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em;
    color: var(--muted-2); text-transform: uppercase;
  }
  .step h3{ font-size: clamp(22px, 1.8vw, 28px); font-weight: 500; }
  .step p{ color: var(--muted); font-size: 15px; max-width: 26em; }
  .step .visual{
    margin-top: auto;
    height: 140px;
    border-radius: 12px;
    background: var(--bg-2);
    border: 1px solid var(--line-2);
    position:relative; overflow:hidden;
  }

  /* ── Ask Goo big section ────────────────────── */
  .ask-canvas{
    background: var(--ink);
    color: #ECECE8;
    border-radius: clamp(20px, 2vw, 28px);
    padding: clamp(40px, 6vw, 88px) clamp(28px, 5vw, 80px);
    position:relative; overflow:hidden;
  }
  .ask-canvas::before{
    content:""; position:absolute; inset:-30%;
    background:
      radial-gradient(40% 30% at 80% 20%, oklch(0.42 0.08 165 / 0.55), transparent 60%),
      radial-gradient(40% 30% at 15% 85%, oklch(0.38 0.06 80 / 0.40), transparent 60%);
    filter: blur(20px);
    pointer-events:none;
  }
  .ask-canvas > *{ position:relative; }
  .ask-canvas .eyebrow{ color: rgba(255,255,255,.55); }
  .ask-canvas .eyebrow .dot{ box-shadow: 0 0 0 4px rgba(255,255,255,.08); }
  .ask-canvas h2{ color:#fff; max-width: 14ch; margin-top: 18px; }
  .ask-canvas .lede{
    margin-top: 24px; color: rgba(255,255,255,.65);
    max-width: 32em; font-size: clamp(16px,1.2vw,18px);
  }
  .ask-thread{
    margin-top: clamp(40px, 5vw, 64px);
    display:flex; flex-direction:column; gap: 14px;
    max-width: 720px;
  }
  .ask-msg{
    padding: 14px 18px; border-radius: 14px;
    font-size: 15px; line-height: 1.5;
    max-width: 85%;
  }
  .ask-msg.you{
    background: rgba(255,255,255,.07);
    color: #fff;
    align-self: flex-start;
    border: 1px solid rgba(255,255,255,.08);
  }
  .ask-msg.goo{
    background: transparent;
    color: rgba(255,255,255,.85);
    align-self: flex-start;
    padding-left: 0;
  }
  .ask-msg.goo .who{
    display:flex; align-items:center; gap:8px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(255,255,255,.45);
    margin-bottom: 8px;
  }
  .ask-msg.goo .who .d{ width:6px; height:6px; border-radius:50%; background:var(--accent); }

  /* ── Final CTA ──────────────────────────────── */
  .final{
    text-align: center;
    padding: clamp(120px, 16vw, 200px) 0;
    position:relative;
  }
  .final h2{
    font-size: clamp(48px, 7vw, 104px);
    max-width: 12ch; margin: 0 auto 32px;
    letter-spacing: -0.035em; font-weight: 440;
  }
  .final .sub{
    color: var(--muted); max-width: 32em; margin: 0 auto 40px;
    font-size: clamp(16px,1.2vw,18px);
  }

  /* ── Footer ─────────────────────────────────── */
  footer{
    border-top: 1px solid var(--line);
    padding: 48px 0 56px;
    font-size: 13px; color: var(--muted);
  }
  footer .row{
    display:flex; justify-content:space-between; align-items:center;
    gap: 24px; flex-wrap: wrap;
  }
  footer .links{ display:flex; gap: 24px; }
  footer a:hover{ color: var(--ink); }

  /* ── Fade-up util ───────────────────────────── */
  .fade-up{ opacity:0; transform: translateY(14px); transition: opacity .9s ease, transform .9s ease; }
  .fade-up.in{ opacity:1; transform:none; }

  /* ── Profile mockup (right side of hero) ────── */
  .profile{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow:
      0 1px 0 rgba(255,255,255,.6) inset,
      0 30px 80px -30px rgba(20,20,15,.18),
      0 6px 20px -10px rgba(20,20,15,.08);
    overflow:hidden;
    position: relative;
    max-width: 100%;
  }
  .profile .url-bar{
    display:flex; align-items:center; justify-content:space-between;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: color-mix(in oklab, var(--bg-2) 60%, transparent);
    font-family: var(--mono); font-size: 11.5px;
    color: var(--muted);
  }
  .profile .url-bar .dots{ display:flex; gap:6px; }
  .profile .url-bar .dots i{
    width:9px; height:9px; border-radius:50%;
    background: var(--line); display:block;
  }
  .profile .url-bar .url{
    flex: 1; text-align:center;
    color: var(--ink-2);
  }
  .profile .url-bar .url b{ color: var(--ink); font-weight: 500; }
  .profile .url-bar .lock{ opacity: 0.5; font-size: 10px; }
  .profile .body{
    padding: clamp(28px, 3vw, 40px);
    display:flex; flex-direction: column; gap: clamp(24px, 2.5vw, 32px);
  }

  .pf-head{ display:flex; gap: 20px; align-items:center; }
  .pf-head > div:last-child{ flex: 1; min-width: 0; }
  .pf-avatar{
    width: 76px; height: 76px; border-radius: 50%;
    background:
      radial-gradient(120% 120% at 25% 25%,
        oklch(0.86 0.04 80) 0%,
        oklch(0.74 0.05 60) 45%,
        oklch(0.52 0.06 50) 100%);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05), 0 4px 12px -6px rgba(0,0,0,.15);
    position:relative; flex-shrink:0;
    overflow:hidden;
  }
  .pf-avatar::after{
    content:"MV"; position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    color: rgba(255,255,255,.85); font-weight: 500; font-size: 22px;
    letter-spacing: -0.01em;
  }
  .pf-name{ font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
  .pf-desc{ color: var(--muted); font-size: 13.5px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 520px){
    .pf-desc{ white-space: normal; overflow: visible; text-overflow: clip; }
  }
  .pf-live{
    display:inline-flex; align-items:center; gap:6px;
    font-family: var(--mono); font-size: 10px;
    color: var(--accent-ink); text-transform: uppercase; letter-spacing: 0.12em;
    margin-top: 6px;
  }
  .pf-live i{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ box-shadow: 0 0 0 0 var(--accent-soft); }
    50%{ box-shadow: 0 0 0 6px transparent; }
  }

  .pf-section-label{
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 10px;
  }
  .pf-summary{
    font-size: 15px; line-height: 1.55; color: var(--ink-2);
    max-width: 38em;
  }
  .pf-summary .cursor{
    display:inline-block; width: 6px; height: 14px;
    background: var(--accent); vertical-align: -2px;
    margin-left: 2px;
    animation: blink 1.05s steps(2) infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .pf-current{
    display:grid; grid-template-columns: 1fr 1fr;
    gap: 6px 24px;
    font-size: 14px;
  }
  @media (max-width: 520px){ .pf-current{ grid-template-columns: 1fr; } }
  .pf-current .row{
    display:flex; align-items:baseline; gap: 10px;
    padding: 8px 0;
    border-bottom: 1px solid var(--line-2);
  }
  .pf-current .row .k{
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.06em; color: var(--muted);
    text-transform: uppercase; min-width: 80px;
  }
  .pf-current .row .v{ color: var(--ink); font-weight: 450; }
  .pf-current .row .v a{ border-bottom: 1px solid var(--line); padding-bottom:1px; }

  .pf-tags{ display:flex; flex-wrap: wrap; gap: 6px; }
  .pf-tag{
    font-size: 12.5px;
    padding: 5px 10px; border-radius: 999px;
    background: var(--bg-2);
    color: var(--ink-2);
    border: 1px solid var(--line-2);
  }
  .pf-tag.accent{ background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }

  .pf-links{ display:flex; flex-direction: column; gap: 2px; }
  .pf-link{
    display:flex; align-items:center; justify-content:space-between;
    padding: 12px 2px;
    border-bottom: 1px solid var(--line-2);
    font-size: 14.5px;
    transition: padding .2s ease;
  }
  .pf-link:hover{ padding-left: 6px; }
  .pf-link .meta{ color: var(--muted); font-size: 12.5px; font-family: var(--mono); }
  .pf-link .arrow{ color: var(--muted-2); transition: transform .2s ease; }
  .pf-link:hover .arrow{ transform: translateX(3px); color: var(--ink); }

  .pf-ask{
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 16px;
    background: color-mix(in oklab, var(--bg-2) 40%, transparent);
    display:flex; flex-direction: column; gap: 12px;
  }
  .pf-ask .field{
    display:flex; align-items:center; gap: 10px;
  }
  .pf-ask .field .star{
    width: 18px; height: 18px; flex-shrink: 0;
    color: var(--accent-ink);
  }
  .pf-ask .field input{
    flex:1; border:0; outline:0; background:transparent;
    font: inherit; font-size: 14px; color: var(--ink);
  }
  .pf-ask .field input::placeholder{ color: var(--muted-2); }
  .pf-ask .field .kbd{
    font-family: var(--mono); font-size: 10.5px;
    padding: 3px 7px; border-radius: 5px;
    background: #fff; border: 1px solid var(--line);
    color: var(--muted);
  }
  .pf-ask .suggestions{
    display:flex; flex-wrap: wrap; gap: 6px;
  }
  .pf-ask .sug{
    font-size: 12px;
    color: var(--ink-2);
    padding: 5px 10px;
    border-radius: 999px;
    background: #fff;
    border: 1px solid var(--line);
    cursor: pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .pf-ask .sug:hover{
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  .pf-ask .answer{
    border-top: 1px dashed var(--line);
    padding-top: 12px;
    font-size: 13.5px;
    color: var(--ink-2);
    line-height: 1.55;
    white-space: pre-wrap;
  }
  .pf-ask .answer .who{
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--muted);
    display:flex; align-items:center; gap:6px;
    margin-bottom: 6px;
  }
  .pf-ask .answer .who .d{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
  }
  .pf-ask .answer .dots i{
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background: var(--muted-2); margin-right:3px;
    animation: dot 1.2s infinite;
  }
  .pf-ask .answer .dots i:nth-child(2){ animation-delay: .15s; }
  .pf-ask .answer .dots i:nth-child(3){ animation-delay: .3s; }
  @keyframes dot{
    0%,80%,100%{ transform: translateY(0); opacity:.5; }
    40%{ transform: translateY(-3px); opacity: 1; }
  }

  /* ── Step visuals (HTML/CSS only, restrained) ── */
  .viz-connect{
    display:flex; flex-direction: column; gap: 6px;
    padding: 16px;
  }
  .viz-connect .chip{
    height: 24px; border-radius: 6px;
    background: var(--card); border: 1px solid var(--line);
    display:flex; align-items:center; padding: 0 10px;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    gap: 8px;
  }
  .viz-connect .chip i{
    width:8px;height:8px;border-radius:2px;background: var(--accent-soft);
    border: 1px solid var(--accent);
  }
  .viz-connect .chip:nth-child(2) i{ background: var(--line); border-color: var(--muted-2); }
  .viz-connect .chip:nth-child(3) i{ background: oklch(0.94 0.05 80); border-color: oklch(0.72 0.08 80); }

  .viz-synth{
    position:relative;
    padding: 16px;
    display:flex; flex-direction:column; gap: 8px;
  }
  .viz-synth .ln{
    height: 7px; border-radius: 3px;
    background: linear-gradient(90deg, var(--line) 0%, var(--bg-2) 100%);
  }
  .viz-synth .ln.a{ width: 92%; background: var(--ink); opacity: .92; }
  .viz-synth .ln.b{ width: 80%; }
  .viz-synth .ln.c{ width: 72%; background: var(--accent); opacity:.4; }
  .viz-synth .ln.d{ width: 65%; }
  .viz-synth .ln.e{ width: 45%; }

  .viz-share{
    padding: 16px;
    display:flex; gap: 8px; align-items:center; justify-content: center;
    flex-wrap: wrap; height: 100%;
  }
  .viz-share .node{
    padding: 6px 10px; border-radius: 999px;
    background: var(--card); border: 1px solid var(--line);
    font-family: var(--mono); font-size: 10.5px;
    color: var(--ink-2);
  }
  .viz-share .node.you{ background: var(--ink); color: #fff; border-color: var(--ink); }
  .viz-share .node.ai{ background: var(--accent-soft); color: var(--accent-ink); border-color: transparent; }

  /* density modes (set via data-density on root) */
  [data-density="compact"]{ --rhythm: clamp(72px, 9vw, 120px); }
  [data-density="spacious"]{ --rhythm: clamp(120px, 16vw, 220px); }

  /* type pairing variants */
  [data-type="serif-display"] h1, [data-type="serif-display"] h2{
    font-family: var(--serif); font-weight: 400; letter-spacing: -0.02em;
  }
  [data-type="serif-display"] h1{ letter-spacing: -0.025em; }
  [data-type="mono-display"] h1, [data-type="mono-display"] h2{
    font-family: var(--mono); font-weight: 500; letter-spacing: -0.04em;
  }

  /* ── Signup form (Final CTA) ─────────────────── */
  .signup-form{
    max-width: 560px;
    margin: 8px auto 0;
    text-align: left;
  }
  .signup-fields{
    display: grid;
    grid-template-columns: 1.4fr 1fr auto;
    gap: 8px;
    align-items: stretch;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 8px 24px -16px rgba(0,0,0,.15);
  }
  @media (max-width: 640px){
    .signup-fields{
      grid-template-columns: 1fr;
      border-radius: 18px;
      padding: 10px;
      gap: 10px;
    }
  }
  .signup-form input[type="email"],
  .signup-form select{
    border: 0;
    background: transparent;
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    padding: 11px 16px;
    border-radius: 999px;
    outline: 0;
    min-width: 0;
  }
  .signup-form input[type="email"]::placeholder{ color: var(--muted-2); }
  .signup-form input[type="email"]:focus,
  .signup-form select:focus{ background: var(--bg-2); }
  .signup-form select{
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%236F6B66' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 14px center;
    padding-right: 32px;
  }
  .signup-form .btn-primary{
    padding: 11px 18px;
    font-size: 14px;
    justify-content: center;
  }
  .signup-form .btn-primary[disabled]{ opacity: .6; cursor: not-allowed; }
  .signup-honeypot{
    position: absolute;
    left: -10000px;
    top: auto;
    width: 1px; height: 1px;
    overflow: hidden;
  }
  .signup-error{
    margin-top: 12px;
    color: oklch(0.55 0.15 25);
    font-size: 13.5px;
    text-align: center;
  }
  .signup-success{
    max-width: 560px;
    margin: 8px auto 0;
    padding: 18px 22px;
    border-radius: 18px;
    background: var(--accent-soft);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
  }
  .signup-success .signup-check{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    flex-shrink: 0;
  }
  .signup-success p{
    font-size: 15px;
    font-weight: 450;
  }
</style>
</head>

  <input name="bot-field" />
</form>
